services:
  - type: web
    runtime: static
    name: volshebny-vestnik-ar-2026
    buildCommand: sh scripts/build-static.sh
    staticPublishPath: site
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: /*
        name: Permissions-Policy
        value: "camera=(self), microphone=(), geolocation=()"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*.mjs
        name: Content-Type
        value: text/javascript
